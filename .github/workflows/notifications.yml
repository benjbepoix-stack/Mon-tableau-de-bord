# Notifications de Carnet : envoie les rappels dus (résumé du jour, rendez-vous, tâches
# à heure fixe, nouvelles tâches Garage / Maison) aux appareils abonnés.
# GitHub ne lance les tâches planifiées que toutes les quelques heures : chaque lancement
# vérifie donc une fois par minute pendant 5 h 30, puis relance la tâche lui-même.
# Le planning ci-dessous ne sert que de secours si la chaîne s'interrompt.
# Script : scripts/notify/send.mjs. Secrets requis : FIREBASE_SERVICE_ACCOUNT, VAPID_PRIVATE_KEY.
name: Notifications Carnet

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Un seul envoi à la fois : un nouveau lancement remplace celui en cours.
concurrency:
  group: carnet-notifications
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js/core
            scripts/notify
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/notify/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/notify
      - run: node send.mjs
        working-directory: scripts/notify
        env:
          LOOP_MINUTES: 330
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Relancer pour les 5 h 30 suivantes
        if: success() || failure()
        run: gh workflow run notifications.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
